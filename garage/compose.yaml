services:
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    ports:
      - "100.71.86.199:3900:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required from Infisical /garage}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?required from Infisical /garage}
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - shared-services

  webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    depends_on:
      - garage
    environment:
      API_BASE_URL: http://garage:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:?required from Infisical /garage}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: home
    ports:
      - "100.71.86.199:3909:3909"
    networks:
      - shared-services

volumes:
  garage-data:
    name: garage-data

networks:
  shared-services:
    external: true
    name: shared-services
