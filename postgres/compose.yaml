services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    ports:
      - "100.71.86.199:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${PG_USER:?required from Infisical /sure}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?required from Infisical /sure}
      POSTGRES_DB: sure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - shared-services

volumes:
  postgres-data:
    name: shared-postgres-data

networks:
  shared-services:
    name: shared-services
