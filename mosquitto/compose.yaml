services:
  init:
    image: eclipse-mosquitto@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    user: '0:0'
    entrypoint: [/bin/sh, /scripts/init.sh]
    restart: 'no'
    environment:
      CONFIG_B64: ${CONFIG_B64:?required from Infisical /mosquitto}
      MOSQUITTO_PASSWORD_B64: ${MOSQUITTO_PASSWORD_B64:?required from Infisical /mosquitto}
    volumes:
      - data:/config
      - ./init.sh:/scripts/init.sh:ro
  mosquitto:
    image: eclipse-mosquitto@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '100.71.86.199:1883:1883'
      - '100.71.86.199:9001:9001'
    volumes:
      - data:/mosquitto/config
      - mqtt-data:/mosquitto/data
    networks:
      shared-services:
        aliases: [mosquitto]
volumes:
  data:
    name: smarthome-mosquitto-data
  mqtt-data:
    name: smarthome-mosquitto-db
networks:
  shared-services:
    external: true
    name: shared-services
