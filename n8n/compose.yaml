services:
  n8n:
    image: n8nio/n8n:2.11.2
    restart: unless-stopped
    ports:
      - "100.71.86.199:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - shared-services
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_USER: ${PG_USER:?required from Infisical /n8n}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD:?required from Infisical /n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required from Infisical /n8n}
      N8N_EDITOR_BASE_URL: ${N8N_HOST:?required from Infisical /n8n}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?required from Infisical /n8n}
      N8N_PORT: "5678"
      N8N_LOG_LEVEL: warn
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_WORKFLOW_HISTORY_ENABLED: "true"
      N8N_METRICS: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: default
      GENERIC_TIMEZONE: Europe/Tallinn
      TZ: Europe/Tallinn

volumes:
  n8n-data:
    name: n8n-data

networks:
  shared-services:
    external: true
    name: shared-services
